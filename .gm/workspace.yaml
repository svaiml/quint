    exclude:
    - prodx/_external/*
    - tools/optimization/_external/*
    - tools/science-libs/_external/*
    - research/_external/*
  ci:
    include:
    - reasoning-universe/*
    - epistemic-universe/criterium
    - infra-eco/rstmdb
    - infra-eco/inferense
    exclude: []
  full:
    include:
    - '*'
    exclude: []
  research:
    include:
    - '*'
    exclude:
    - prodx/_external/*
  minimal:
    include:
    - reasoning-universe/*
    - epistemic-universe/*
    - infra-eco/*
    - apps/*
    exclude: []
