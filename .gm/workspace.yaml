  # ── prodx ──
  - name: craftegy-design
    path: prodx/craftegy-design
    remote: git@github.com:svaiml/craftegy-design.git
    branch: develop
    group: prodx

  # ── tools ──
  - name: codegraph-rust
    path: tools/ai-tools/codegraph-rust
    remote: git@github.com:sashml/codegraph-rust.git
    branch: main
    group: tools/ai-tools
  - name: flowspec
    path: tools/orchestrator/flowspec
    remote: git@github.com:sashml/flowspec.git
    branch: develop
    group: tools/orchestrator
  - name: gm
    path: tools/sysutils/gm
    remote: git@github.com:svaiml/gm.git
    branch: develop
    group: tools/sysutils
  - name: ghdash
    path: tools/sysutils/ghdash
    remote: git@github.com:zombocoder/ghdash.git
    branch: main
    group: tools/sysutils
  - name: zacta
    path: tools/sysutils/zacta
    remote: git@github.com:zombocoder/zacta.git
    branch: main
    group: tools/sysutils
  - name: vaultura
    path: tools/sysutils/vaultura
    remote: git@github.com:zombocoder/vaultura.git
    branch: main
    group: tools/sysutils

  # ── external: tools/ai-tools ──
  - name: FPF
    path: tools/ai-tools/_external/FPF
    remote: https://github.com/ailev/FPF.git
    branch: main
    group: tools/ai-tools
  - name: codebase-memory-mcp
    path: tools/ai-tools/_external/codebase-memory-mcp
