    remote: git@github.com:sashml/o2l.git
    branch: develop
    group: infra-eco
  - name: bfc
    path: infra-eco/bfc
    remote: git@github.com:zombocoder/bfc.git
    branch: main
    group: infra-eco
  - name: ctop
    path: infra-eco/ctop
    remote: git@github.com:zombocoder/ctop.git
    branch: main
    group: infra-eco
  - name: myria
    path: infra-eco/myria
    remote: git@github.com:zombocoder/myria.git
    branch: main
    group: infra-eco
  - name: npd-cipher
    path: infra-eco/npd-cipher
