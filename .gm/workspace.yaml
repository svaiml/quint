    branch: main
    group: prodx
  - name: DesignOS
    path: prodx/_external/DesignOS
    remote: https://github.com/eclectix7/DesignOS.git
    branch: main
    group: prodx
  - name: open-codesign
    path: prodx/_external/open-codesign
    remote: https://github.com/OpenCoworkAI/open-codesign.git
    branch: main
    group: prodx

  # ── external: epistemic-universe ──
  - name: nanoGPT
    path: epistemic-universe/_external/nanoGPT
    remote: git@github.com:AITechCraft/nanoGPT.git
    branch: master
    group: epistemic-universe

dependencies:
  reasoning-universe/zz-notation:
    - reasoning-universe/infer
  reasoning-universe/fpf-cards:
    - reasoning-universe/infer
  epistemic-universe/criterium:
    - reasoning-universe/infer
    - reasoning-universe/zz-notation
    - reasoning-universe/pctl-rs
  infra-eco/inferense:
    - reasoning-universe/infer
  infra-eco/rstmdb-studio:
    - infra-eco/rstmdb
  apps/reasoning-apps:
    - reasoning-universe/infer
    - infra-eco/rstmdb
    - reasoning-universe/pctl-rs
  apps/code-catalyst:
    - reasoning-universe/infer
    - tools/ai-tools/codegraph-rust
  apps/episteme-platform:
    - reasoning-universe/infer
    - reasoning-universe/zz-notation
    - epistemic-universe/criterium
    - reasoning-universe/pctl-rs
    - infra-eco/rstmdb

