  # ── external: tools/orchestrator ──
  - name: AllBeads
    path: tools/orchestrator/_external/AllBeads
    remote: https://github.com/thrashr888/AllBeads.git
    branch: main
    group: tools/orchestrator
  - name: beads_rust
    path: tools/orchestrator/_external/beads_rust
    remote: https://github.com/Dicklesworthstone/beads_rust.git
    branch: main
    group: tools/orchestrator
  - name: beads_viewer_rust
    path: tools/orchestrator/_external/beads_viewer_rust
    remote: https://github.com/Dicklesworthstone/beads_viewer_rust.git
    branch: main
