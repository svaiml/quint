version: 1

workspace:
  name: zombo-sash-eco
  convention: _external

groups:
  apps:
    path: apps
  epistemic-universe:
    path: epistemic-universe
  reasoning-universe:
    path: reasoning-universe
  infra-eco:
    path: infra-eco
  kernel-forge:
    path: kernel-forge
  prodx:
    path: prodx
  tools/ai-tools:
    path: tools/ai-tools
  tools/orchestrator:
    path: tools/orchestrator
  tools/sysutils:
    path: tools/sysutils

repositories:
  # ── apps ──
  - name: code-catalyst
    path: apps/code-catalyst
    remote: git@github.com:svaiml/code-catalyst.git
    branch: main
    group: apps
  - name: reasoning-apps
    path: apps/reasoning-apps
    remote: git@github.com:zombocoder/reasoning-apps.git
    branch: develop
    group: apps
  - name: research-scaffold
    path: apps/research-scaffold
    remote: git@github.com:svaiml/research-scaffold.git
    branch: main
    group: apps
  - name: episteme-platform
    path: apps/episteme-platform
    remote: git@github.com:sashml/episteme-platform.git
    branch: main
    group: apps

  # ── epistemic-universe ──
  - name: criterium
    path: epistemic-universe/criterium
    remote: git@github.com:svaiml/criterium.git
    branch: develop
    group: epistemic-universe
  - name: epistemic-game
    path: epistemic-universe/epistemic-game
    remote: git@github.com:svaiml/epistemic-game.git
    branch: main
    group: epistemic-universe
  - name: episteme-lab
    path: epistemic-universe/episteme-lab
    remote: git@github.com:AITechCraft/episteme-lab.git
    branch: master
    group: epistemic-universe
  - name: pbelnap
    path: epistemic-universe/pbelnap
    remote: git@github.com:AITechCraft/pbelnap.git
    branch: main
    group: epistemic-universe
  - name: bilattice-relabeler
    path: epistemic-universe/bilattice-relabeler
    remote: git@github.com:AITechCraft/bilattice-relabeler.git
    branch: main
    group: epistemic-universe

  # ── reasoning-universe ──
  - name: infer
    path: reasoning-universe/infer
    remote: git@github.com:zombocoder/infer.git
    branch: develop
    group: reasoning-universe
  - name: pctl-rs
    path: reasoning-universe/pctl-rs
    remote: git@github.com:zombocoder/pctl-rs.git
    branch: develop
    group: reasoning-universe
  - name: zz-notation
    path: reasoning-universe/zz-notation
    remote: git@github.com:zombocoder/zz-notation.git
    branch: develop
    group: reasoning-universe
  - name: obstruct
    path: reasoning-universe/obstruct
    remote: git@github.com:zombocoder/obstruct.git
    branch: main
    group: reasoning-universe
  - name: craftegy-algo
    path: reasoning-universe/craftegy-algo
    remote: git@github.com:svaiml/craftegy-algo.git
    branch: develop
    group: reasoning-universe
  - name: fpf-cards
    path: reasoning-universe/fpf-cards
    remote: git@github.com:svaiml/fpf-cards.git
    branch: develop
    group: reasoning-universe
  - name: aivm
    path: reasoning-universe/aivm
    remote: git@github.com:zombocoder/aivm.git
    branch: main
    group: reasoning-universe
  - name: axiomvm
    path: reasoning-universe/axiomvm
    remote: git@github.com:zombocoder/axiomvm.git
    branch: main
    group: reasoning-universe

  # ── infra-eco ──
  - name: rstmdb
    path: infra-eco/rstmdb
    remote: git@github.com:rstmdb/rstmdb.git
    branch: main
    group: infra-eco
  - name: rstmdb-studio
    path: infra-eco/rstmdb-studio
    remote: git@github.com:rstmdb/rstmdb-studio.git
    branch: main
    group: infra-eco
  - name: inferense
    path: infra-eco/inferense
    remote: git@github.com:zombocoder/inferense.git
