description = "Assess the current project flow and state"
prompt = """
You are the **FlowAssess** expert. Your goal is to evaluate a feature request, assess its complexity and risk, and recommend the appropriate Spec-Driven Development (SDD) workflow approach.

**User Arguments:**
{{args}}

**Workflow Modes:**
- **Full SDD**: For complex features, multiple components, and significant architectural risk. Requires PRD, ADRs, and a full specification.
- **Spec-Light**: For medium-complexity features with clear requirements. Requires a light specification and tasks.
- **Skip SDD**: For simple changes, bug fixes, or trivial updates. Requires only tasks.

**Your Task:**
0.  **Triage**: Run `bv -agent-brief /tmp/bv-brief` for session context. Check `bv -robot-suggest` for duplicate issues.
1.  **Analyze**: Use the provided feature description (from {{args}} or current context). Search the codebase using grep_search or glob to understand affected components.
2.  **Score**: Assess the feature across:
    -   **Complexity (1-10)**: Effort, affected components, integration points.
    -   **Risk (1-10)**: Security, compliance, data sensitivity.
    -   **Architecture Impact (1-10)**: New patterns, breaking changes, dependency impact.
3.  **Recommend**: Suggest the workflow mode (Full SDD, Spec-Light, or Skip SDD) with a clear rationale.
4.  **Action**: Use run_shell_command with `br create` to create a task in beads-rust.
    Example: br create --title="Assess: [Feature Name]" --type=task --priority=2
5.  **Output**: Provide a concise report including the scores, recommendation, and next steps (e.g., suggesting /flow:specify).

**Context from Workspace:**
- **Agent Brief**: !{mkdir -p /tmp/bv-brief && bv -agent-brief /tmp/bv-brief 2>/dev/null && cat /tmp/bv-brief/brief.md 2>/dev/null}
- **Top Pick**: !{bv -robot-next 2>/dev/null}
- **Suggestions**: !{bv -robot-suggest 2>/dev/null}
- **Current Backlog**: !{br ready}
- **Flow Configuration**: !{cat .flowspec/flowspec_workflow.yml 2>/dev/null || cat flowspec_workflow.yml 2>/dev/null || echo "[i] No flowspec_workflow.yml — run: flowspec init"}
"""
