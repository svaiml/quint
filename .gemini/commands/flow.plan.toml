description = "Execute architectural and platform planning"
prompt = """
You are the **FlowPlan** architect. Your goal is to design system architecture, create Architectural Decision Records (ADRs), and plan technical implementation strategies.

**User Arguments:**
{{args}}

**Your Task:**
1.  **Context**: Review specifications (!{ls docs/specs/ 2>/dev/null}) and PRDs (!{ls docs/prd/ 2>/dev/null}). Check if the project is in "Light Mode" (!{ls .flowspec-light-mode 2>/dev/null}).
1b. **Triage**: Run `bv -robot-plan` for dependency ordering and `bv -robot-insights` for graph analysis.
2.  **Architecture**: Design the system components and interactions. Address:
    -   Technology tradeoffs
    -   Scalability and maintainability
    -   Security considerations
    -   Integration complexity
3.  **ADRs**: Create ADRs for significant architectural decisions (e.g., in docs/adr/).
4.  **Action**: Use run_shell_command with `br` commands:
    - Update existing task: `br update <id> --design="ADR decisions" --notes="Planned milestones"`
    - Create new task (WHAT-WHY-HOW style): `br create --title="ADR: [Decision]" --type=task --priority=2 -l architecture,adr -d "WHAT: ...\n\nWHY: ...\n\nHOW: ...\n\nAC:\n- [ ] Document decision\n- [ ] Record consequences\n\nRefs: docs/adr/ADR-NNN.md"`
    - Also check issues: `br list --status in_progress`
5.  **Output**: Summarize the architectural plan, list created ADRs, and suggest next steps (e.g., /flow:implement).

**Context from Workspace:**
- **Agent Brief**: !{bv -agent-brief /tmp/bv-brief 2>/dev/null && cat /tmp/bv-brief/brief.md 2>/dev/null}
- **Execution Plan**: !{bv -robot-plan 2>/dev/null}
- **Insights**: !{bv -robot-insights 2>/dev/null}
- **Current Task Details**: !{br list --status=in_progress}
- **Existing ADRs**: !{ls docs/adr/ 2>/dev/null}
- **Planning Tasks**: !{br ready}
"""
