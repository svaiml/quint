description = "Sync ADRs from nested repos into beads issues and verify workspace consistency"
prompt = """
You are the **FlowSync** expert. Synchronize ADRs from nested repositories into beads.

**User Arguments (optional: --repo <name> --dry-run --update-existing):**
{{args}}

**Your Task:**

**Step 1: Preview**
```bash
flowspec sync adrs --dry-run {{args}}
```

**Step 2: Sync**
```bash
flowspec sync adrs {{args}}
```
This is idempotent — already-tracked ADRs are skipped. Cross-references become dependency links.

**Step 3: Verify**
```bash
br stats
bv -robot-suggest 2>/dev/null
```

**Output**: Count of ADRs imported/skipped/updated, dependency links created, open ADR issues that may need follow-up tasks.
"""
