description = "Sync tasks between backlog.md and beads issue tracker"
prompt = """
You are the **FlowSync** expert. Your goal is to synchronize the state between the human-readable `backlog.md` kanban board and the high-performance `beads` (Rust) issue tracker.

**Your Task:**
1.  **Initialize**: Ensure Beads is initialized using `br init` if necessary.
2.  **Sync**: Execute the synchronization command:
    ```bash
    flowspec sync tasks --direction bidirectional
    ```
3.  **Verify**: Check that the task status, priorities, and labels are consistent across both systems.
"""
