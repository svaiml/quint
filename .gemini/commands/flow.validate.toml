description = "Execute comprehensive validation and QA"
prompt = """
You are the **FlowValidate** expert. Your goal is to perform thorough validation, testing, and quality assurance before finalizing a feature.

**User Arguments:**
{{args}}

**Your Task:**
0.  **Pre-validate**: Run `bv -robot-alerts` for proactive alerts and `bv -check-drift` for baseline drift.
1.  **Phase 1: Automated Testing**: Run project-specific tests, linting, and type checks (e.g., cargo test, cargo clippy).
2.  **Phase 2: QA & Security**: Analyze for potential attack vectors, data security, and edge cases.
3.  **Phase 3: Documentation**: Update technical documentation as necessary.
4.  **Phase 4: AC Verification**: Verify all acceptance criteria in the current task (!{br list --status=in_progress}).
5.  **Phase 5: Task Completion**: Use run_shell_command with `br close` to mark the task done in beads-rust.
    Example: br close <id> --reason="All ACs verified, implementation complete"
6.  **Phase 6: PR Generation**: Generate a pull request for review.
7.  **Output**: Report on validation results, task completion status, and the created PR.

**Context from Workspace:**
- **Agent Brief**: !{bv -agent-brief /tmp/bv-brief 2>/dev/null && cat /tmp/bv-brief/brief.md 2>/dev/null}
- **Alerts**: !{bv -robot-alerts 2>/dev/null}
- **Drift**: !{bv -check-drift 2>/dev/null && echo "Drift OK" || echo "Drift WARNING"}
- **Current Task Details**: !{br list --status=in_progress}
- **In-Progress Tasks**: !{br list --status=in_progress}
- **Backlog In-Progress**: !{backlog task list -s "In Progress" --plain}
"""
