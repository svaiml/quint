# Flowspec Workflow Configuration
# Generated by: flowspec init
#
# Validation modes:
#   NONE - No gate, immediate pass-through
#   KEYWORD["<string>"] - Require user to type exact keyword
#   PULL_REQUEST - Require PR to be merged

version: "1.0"

transitions:
  - name: assess
    from: "To Do"
    to: "Assessed"
    validation: NONE

  - name: specify
    from: "Assessed"
    to: "Specified"
    validation: NONE

  - name: plan
    from: "Specified"
    to: "Planned"
    validation: NONE

  - name: implement
    from: "Planned"
    to: "In Implementation"
    validation: NONE

  - name: validate
    from: "In Implementation"
    to: "Validated"
    validation: NONE
